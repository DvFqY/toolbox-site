<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔防战争 - 在线工具箱</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.td-wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.td-canvas-wrap{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 4px 30px rgba(0,0,0,.12)}
.td-sidebar{width:200px;display:flex;flex-direction:column;gap:10px}
.td-info{background:var(--surface);border-radius:10px;padding:12px;border:1px solid var(--border)}
.td-info .row{display:flex;justify-content:space-between;font-size:.85rem;margin:4px 0}
.td-info .lbl{color:var(--text-secondary)}.td-info .val{font-weight:700}
.td-towers{display:flex;flex-direction:column;gap:6px}
.td-tower-btn{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:all .2s;text-align:left;font-size:.82rem}
.td-tower-btn:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(99,102,241,.15)}
.td-tower-btn.selected{border-color:var(--primary);background:var(--primary-light)}
.td-tower-icon{width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.td-tower-info{flex:1}.td-tower-name{font-weight:600;font-size:.82rem}.td-tower-cost{font-size:.75rem;color:var(--text-secondary)}
.td-hint{font-size:.8rem;color:var(--text-secondary);text-align:center;margin-top:6px}
@media(max-width:700px){.td-wrap{flex-direction:column-reverse;align-items:center}.td-sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center}.td-info{flex:1;min-width:140px}}
</style>

<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回工具箱</a>
  <div class="tool-header"><h1>🏰 塔防战争</h1><p class="desc">2.5D等距视角 · 4种防御塔 · 5个关卡 · 点击空地造塔 · 点击已有塔升级</p></div>
  <div class="tool-body">
    <div class="td-wrap">

          <div class="row"><span class="lbl">🏰 关卡</span><span class="val" id="level">1</span></div>

          <button class="btn btn-secondary btn-sm" id="btnSpeed">⏩ x1</button>
          <button class="btn btn-secondary btn-sm" id="btnSave">💾 存档</button>

        </div>

<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary);text-align:center">

<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script src="../js/ambient-effects.js"></script>
<script>
// ===== 2.5D Tower Defense Game =====
(function(){
var canvas=document.getElementById("tdCanvas"),ctx=canvas.getContext("2d");
var COLS=12,ROWS=10,TILE_W=64,TILE_H=32;
canvas.width=COLS*TILE_W/2+ROWS*TILE_W/2+40;canvas.height=ROWS*TILE_H+COLS*TILE_H/2+100;

var TILE_GRASS=0,TILE_PATH=1,TILE_START=2,TILE_END=3;

// Tower types
var TOWER_TYPES=[
  {id:"arrow",name:"箭塔",icon:"🏹",cost:50,dmg:15,range:3,cd:30,color:"#10b981",desc:"快速射击"},
  {id:"cannon",name:"炮塔",icon:"💣",cost:100,dmg:40,range:2.5,cd:60,color:"#f59e0b",desc:"范围伤害",splash:1.2},
  {id:"ice",name:"冰塔",icon:"❄️",cost:75,dmg:8,range:3,cd:40,color:"#3b82f6",desc:"减速敌人",slow:0.4},
  {id:"lightning",name:"雷塔",icon:"⚡",cost:120,dmg:25,range:3.5,cd:45,color:"#8b5cf6",desc:"连锁闪电",chain:2}
];

// Level definitions: {map, path, waves, startGold, startLives}
var LEVELS=[
  {name:"翠绿平原",gold:200,lives:20,waves:[
    {enemies:[{type:"basic",count:8,interval:30}],reward:80},
    {enemies:[{type:"basic",count:10},{type:"fast",count:3,interval:25}],reward:100},
    {enemies:[{type:"basic",count:8},{type:"fast",count:5},{type:"tank",count:2,interval:40}],reward:150},
    {enemies:[{type:"fast",count:8},{type:"tank",count:4,interval:35}],reward:180},
    {enemies:[{type:"tank",count:5},{type:"fast",count:10},{type:"boss",count:1,interval:80}],reward:300}
  ],path:[[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[3,2],[2,2],[1,2],[1,3],[1,4],[0,4]]},
  {name:"蜿蜒峡谷",gold:250,lives:15,waves:[
    {enemies:[{type:"basic",count:10,interval:25}],reward:100},
    {enemies:[{type:"fast",count:8},{type:"basic",count:6,interval:22}],reward:130},
    {enemies:[{type:"tank",count:4},{type:"fast",count:8,interval:25}],reward:180},
    {enemies:[{type:"tank",count:6},{type:"fast",count:10,interval:22}],reward:220},
    {enemies:[{type:"boss",count:1},{type:"tank",count:4,interval:40},{type:"fast",count:6}],reward:350}
  ],path:[[0,2],[1,2],[2,2],[3,2],[4,2],[5,2],[5,3],[5,4],[5,5],[4,5],[3,5],[2,5],[1,5],[1,4],[1,3],[2,3],[3,3],[4,3],[4,4],[3,4],[2,4],[1,4],[0,4]]},
  {name:"黑暗森林",gold:300,lives:12,waves:[
    {enemies:[{type:"fast",count:12,interval:20}],reward:120},
    {enemies:[{type:"tank",count:5},{type:"fast",count:8,interval:18}],reward:160},
    {enemies:[{type:"tank",count:7},{type:"basic",count:10,interval:20}],reward:200},
    {enemies:[{type:"fast",count:12},{type:"tank",count:5,interval:18}],reward:250},
    {enemies:[{type:"boss",count:2,interval:60},{type:"tank",count:5},{type:"fast",count:8}],reward:400}
  ],path:[[0,7],[1,7],[2,7],[3,7],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5],[1,5],[2,5],[3,5],[4,5],[4,4],[3,4],[2,4],[1,4],[0,4],[0,3],[1,3],[2,3],[3,3],[4,3],[4,2],[3,2],[2,2],[1,2],[0,2]]},
  {name:"熔岩之地",gold:350,lives:10,waves:[
    {enemies:[{type:"tank",count:8,interval:28}],reward:150},
    {enemies:[{type:"tank",count:6},{type:"fast",count:10,interval:18}],reward:200},
    {enemies:[{type:"boss",count:1},{type:"tank",count:5,interval:30}],reward:280},
    {enemies:[{type:"fast",count:15,interval:15},{type:"tank",count:5,interval:25}],reward:300},
    {enemies:[{type:"boss",count:2,interval:40},{type:"tank",count:8,interval:20},{type:"fast",count:10}],reward:500}
  ],path:[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1],[11,1],[11,2],[10,2],[9,2],[8,2],[7,2],[6,2],[5,2],[4,2],[3,2],[2,2],[1,2],[0,2],[0,3],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3],[7,3],[8,3],[9,3],[10,3],[11,3]]},
  {name:"最终决战",gold:400,lives:8,waves:[
    {enemies:[{type:"boss",count:1},{type:"tank",count:6,interval:25}],reward:200},
    {enemies:[{type:"fast",count:15,interval:12},{type:"tank",count:5,interval:20}],reward:250},
    {enemies:[{type:"boss",count:2,interval:40},{type:"tank",count:8,interval:18}],reward:350},
    {enemies:[{type:"fast",count:20,interval:10},{type:"tank",count:8,interval:15},{type:"boss",count:1}],reward:400},
    {enemies:[{type:"boss",count:3,interval:35},{type:"tank",count:10,interval:15},{type:"fast",count:15,interval:10}],reward:600}
  ],path:[[0,4],[1,4],[2,3],[3,3],[4,2],[5,2],[6,1],[7,1],[8,2],[9,2],[10,3],[11,3],[11,4],[10,5],[9,5],[8,6],[7,6],[6,7],[5,7],[4,6],[3,6],[2,5],[1,5],[0,4]]}
];

// Game state
var state={
  currentLevel:0, gold:0, lives:0, kills:0,
  wave:0, waveActive:false, speed:1,
  towers:[], enemies:[], projectiles:[],
  selectedTower:null, map:[], path:[], pathSet:null,
  spawnQueue:[], spawnTimer:0, gameOver:false, gameWon:false
};

// Enemy types
var ENEMY_TYPES={
  basic:{name:"小兵",hp:80,speed:1.2,reward:15,color:"#ef4444",size:8},
  fast:{name:"快兵",hp:50,speed:2.5,reward:20,color:"#f97316",size:7},
  tank:{name:"坦克",hp:250,speed:.7,reward:35,color:"#7c3aed",size:11},
  boss:{name:"BOSS",hp:600,speed:.5,reward:100,color:"#dc2626",size:14}
};

// Isometric projection
function iso(x,y){return{x:(x-y)*TILE_W/2+canvas.width/2-TILE_W/2,y:(x+y)*TILE_H/2+30}}

// Sound effects
function sfx(freq,dur,type,vol){
  try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||.08,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);o.connect(g);g.connect(a.destination);
  o.start();o.stop(a.currentTime+dur)}catch(e){}
}

function sfxShoot(){sfx(600,.08,'square',.06)}
function sfxExplosion(){sfx(80,.2,'sawtooth',.1)}
function sfxCoin(){sfx(1200,.06,'sine',.06);setTimeout(function(){sfx(1600,.06,'sine',.06)},60)}
function sfxPlace(){sfx(400,.1,'triangle',.08)}
function sfxWaveStart(){sfx(300,.15,'sine',.06);setTimeout(function(){sfx(500,.15,'sine',.06)},150);setTimeout(function(){sfx(700,.2,'sine',.08)},300)}
function sfxGameOver(){sfx(150,.4,'sawtooth',.12)}
function sfxWin(){sfx(500,.1,'sine',.08);setTimeout(function(){sfx(700,.1,'sine',.08)},100);setTimeout(function(){sfx(900,.15,'sine',.1)},200);setTimeout(function(){sfx(1100,.2,'sine',.1)},300)}

// Init level
function initLevel(lvl){
  var L=LEVELS[lvl];
  state.currentLevel=lvl;state.gold=L.gold;state.lives=L.lives;state.kills=0;
  state.wave=0;state.waveActive=false;state.gameOver=false;state.gameWon=false;
  state.towers=[];state.enemies=[];state.projectiles=[];state.spawnQueue=[];
  state.path=L.path;
  state.pathSet=new Set();L.path.forEach(function(p){state.pathSet.add(p[0]+","+p[1])});
  // Build map
  state.map=[];for(var r=0;r<ROWS;r++){state.map[r]=[];for(var c=0;c<COLS;c++)state.map[r][c]=TILE_GRASS}
  L.path.forEach(function(p,i){state.map[p[1]][p[0]]=i===0?TILE_START:i===L.path.length-1?TILE_END:TILE_PATH});
  updateHUD();
  document.getElementById("btnStart").textContent="▶ 开始波次";
  document.getElementById("btnStart").disabled=false;
}

function updateHUD(){
  document.getElementById("lives").textContent=state.lives;
  document.getElementById("gold").textContent=state.gold;
  document.getElementById("wave").textContent=state.wave+"/5";
  document.getElementById("level").textContent=state.currentLevel+1;
  document.getElementById("kills").textContent=state.kills;
}

// Start wave
function startWave(){
  if(state.waveActive||state.gameOver||state.gameWon)return;
  if(state.wave>=5){state.gameWon=true;sfxWin();document.getElementById("btnStart").textContent="🎉 通关!";document.getElementById("btnStart").disabled=true;return}
  sfxWaveStart();
  state.waveActive=true;state.spawnQueue=[];
  var w=LEVELS[state.currentLevel].waves[state.wave];
  w.enemies.forEach(function(eg){
    for(var i=0;i<eg.count;i++)state.spawnQueue.push({type:eg.type,delay:(eg.interval||30)*(i+1)});
  });
  state.spawnQueue.sort(function(a,b){return a.delay-b.delay});
  state.spawnTimer=0;
  state.wave++;
  updateHUD();
  document.getElementById("btnStart").textContent="⏳ 波次进行中...";
  document.getElementById("btnStart").disabled=true;
}

function spawnEnemy(type){
  var et=ENEMY_TYPES[type];
  var start=state.path[0];
  var e={type:type,x:start[0],y:start[1],pathIdx:0,hp:et.hp,maxHp:et.hp,speed:et.speed,
    reward:et.reward,color:et.color,size:et.size,slow:0,alive:true};
  if(type==="boss"){e.hp=et.hp+state.currentLevel*200;e.maxHp=e.hp}
  state.enemies.push(e);
}

// Update logic
function update(){
  if(!state.waveActive||state.gameOver||state.gameWon)return;
  for(var s=0;s<state.speed;s++){
    // Spawn
    state.spawnTimer++;
    while(state.spawnQueue.length>0&&state.spawnQueue[0].delay<=state.spawnTimer)spawnEnemy(state.spawnQueue.shift().type);

    // Move enemies
    state.enemies.forEach(function(e){
      if(!e.alive)return;
      var sp=e.speed*(e.slow>0?0.4:1);
      e.pathIdx+=sp*0.06;
      if(e.pathIdx>=state.path.length-1){e.alive=false;state.lives--;updateHUD();if(state.lives<=0)endGame(false);return}
      var i=Math.floor(e.pathIdx),f=e.pathIdx-i;
      var p1=state.path[i],p2=state.path[Math.min(i+1,state.path.length-1)];
      e.x=p1[0]+(p2[0]-p1[0])*f;e.y=p1[1]+(p2[1]-p1[1])*f;
      if(e.slow>0)e.slow--;
    });
    state.enemies=state.enemies.filter(function(e){return e.alive});

    // Towers attack
    state.towers.forEach(function(t){
      if(t.cdLeft>0){t.cdLeft--;return}
      var target=null,minDist=Infinity;
      state.enemies.forEach(function(e){
        var dx=e.x-t.x,dy=e.y-t.y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<t.range&&dist<minDist){minDist=dist;target=e}
      });
      if(!target)return;
      t.cdLeft=t.cd;
      var td=TOWER_TYPES.find(function(tt){return tt.id===t.type});
      // Animate turret
      var dx=target.x-t.x,dy=target.y-t.y;
      t.angle=Math.atan2(dy,dx);
      sfxShoot();
      // Create projectile
      state.projectiles.push({x:t.x,y:t.y,tx:target.x,ty:target.y,life:12,type:t.type,dmg:td.dmg*(1+t.level*.5),
        splash:td.splash||0,slow:td.slow||0,chain:td.chain||0,target:target,hit:[]});
    });

    // Update projectiles
    state.projectiles.forEach(function(p){
      p.life--;var t=1-p.life/12;
      p.cx=p.x+(p.tx-p.x)*t;p.cy=p.y+(p.ty-p.y)*t;
      if(p.life<=0){
        // Damage target
        if(p.target&&p.target.alive){
          damageEnemy(p.target,p.dmg,p.slow);
          sfxExplosion();
          // Splash
          if(p.splash>0)state.enemies.forEach(function(e){
            if(e!==p.target&&e.alive){var dx=e.x-p.target.x,dy=e.y-p.target.y;if(Math.sqrt(dx*dx+dy*dy)<p.splash)damageEnemy(e,p.dmg*.4,p.slow)}
          });
          // Chain
          if(p.chain>0){
            var chainSrc=p.target,remaining=p.chain;
            while(remaining>0){
              var nearest=null,nd=Infinity;
              state.enemies.forEach(function(e){if(e.alive&&e!==chainSrc&&!p.hit.includes(e)){var dx=e.x-chainSrc.x,dy=e.y-chainSrc.y,d=Math.sqrt(dx*dx+dy*dy);if(d<2&&d<nd){nd=d;nearest=e}}});
              if(!nearest)break;
              p.hit.push(nearest);damageEnemy(nearest,p.dmg*.5,p.slow);chainSrc=nearest;remaining--;
            }
          }
        }
      }
    });
    state.projectiles=state.projectiles.filter(function(p){return p.life>0});

    // Check wave complete
    if(state.spawnQueue.length===0&&state.enemies.length===0&&state.projectiles.length===0){
      state.waveActive=false;
      state.gold+=LEVELS[state.currentLevel].waves[Math.min(state.wave-1,4)].reward;
      updateHUD();
      document.getElementById("btnStart").textContent=state.wave>=5?"🎉 通关!":"▶ 开始波次";
      document.getElementById("btnStart").disabled=state.wave>=5;
      sfxCoin();
      if(state.wave>=5&&!state.gameOver){state.gameWon=true;sfxWin()}
    }
  }
}

function damageEnemy(e,dmg,slow){
  e.hp-=dmg;
  if(slow>0)e.slow=Math.max(e.slow,60);
  if(e.hp<=0){e.alive=false;state.gold+=e.reward;state.kills++;updateHUD();sfxCoin()}
}

function endGame(won){
  state.gameOver=!won;state.waveActive=false;
  if(!won){sfxGameOver();document.getElementById("btnStart").textContent="😵 重新开始";document.getElementById("btnStart").disabled=false}
  document.getElementById("btnStart").onclick=function(){initLevel(state.currentLevel)}
}

// Place tower
function placeTower(col,row){
  if(!state.selectedTower)return;
  if(state.pathSet.has(col+","+row))return;
  if(state.towers.find(function(t){return t.x===col&&t.y===row}))return;
  var td=TOWER_TYPES[state.selectedTower];
  if(state.gold<td.cost)return;
  state.gold-=td.cost;
  state.towers.push({type:td.id,x:col,y:row,level:1,cd:td.cd,cdLeft:0,range:td.range,angle:0});
  updateHUD();
  sfxPlace();
}

// Upgrade tower
function upgradeTower(col,row){
  var t=state.towers.find(function(t){return t.x===col&&t.y===row});
  if(!t||t.level>=3)return;
  var td=TOWER_TYPES.find(function(tt){return tt.id===t.type});
  var cost=td.cost*(t.level+1);
  if(state.gold<cost)return;
  state.gold-=cost;t.level++;t.range+=.3;t.cd=Math.max(10,td.cd-5);
  updateHUD();sfxPlace();
}

// Render
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Sky gradient
  var sky=ctx.createLinearGradient(0,0,0,canvas.height);
  sky.addColorStop(0,"#1a1a2e");sky.addColorStop(.4,"#16213e");sky.addColorStop(1,"#0f3460");
  ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height);

  // Draw tiles
  for(var r=ROWS-1;r>=0;r--){
    for(var c=0;c<COLS;c++){
      var p=iso(c,r);
      // Tile base
      var isPath=state.pathSet.has(c+","+r);
      var isStart=state.map[r][c]===TILE_START,isEnd=state.map[r][c]===TILE_END;

      // Shadow
      ctx.fillStyle="rgba(0,0,0,.2)";
      ctx.beginPath();ctx.moveTo(p.x,p.y+TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H);ctx.lineTo(p.x+TILE_W,p.y+TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y);ctx.fill();

      // Top face
      if(isPath){var pg=ctx.createLinearGradient(p.x,p.y,p.x+TILE_W,p.y+TILE_H);
        pg.addColorStop(0,"#c4a97d");pg.addColorStop(1,"#a0845c");ctx.fillStyle=pg}
      else{var pg=ctx.createLinearGradient(p.x,p.y,p.x+TILE_W,p.y+TILE_H);
        pg.addColorStop(0,"#4a7c59");pg.addColorStop(1,"#3d6b4f");ctx.fillStyle=pg}
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H/2);ctx.lineTo(p.x+TILE_W,p.y);ctx.lineTo(p.x+TILE_W/2,p.y-TILE_H/2);ctx.fill();

      // Left face
      ctx.fillStyle=isPath?"#8b7355":"#2d5a3f";
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H/2+10);ctx.lineTo(p.x,p.y+10);ctx.fill();

      // Right face
      ctx.fillStyle=isPath?"#6b5a42":"#1e4730";
      ctx.beginPath();ctx.moveTo(p.x+TILE_W,p.y);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y+TILE_H/2+10);ctx.lineTo(p.x+TILE_W,p.y+10);ctx.fill();

      // Start/End markers
      if(isStart){ctx.fillStyle="#10b981";ctx.beginPath();ctx.arc(p.x+TILE_W/2,p.y-4,6,0,Math.PI*2);ctx.fill()}
      if(isEnd){ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(p.x+TILE_W/2,p.y-4,6,0,Math.PI*2);ctx.fill()}
    }
  }

  // Draw towers
  state.towers.forEach(function(t){
    var p=iso(t.x,t.y);
    var td=TOWER_TYPES.find(function(tt){return tt.id===t.type});
    // Base
    var h=16+t.level*6;
    ctx.fillStyle="#555";ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y,h*.4,h*.15,0,0,Math.PI*2);ctx.fill();
    // Body - stacked ellipses for 3D
    for(var i=h;i>=4;i-=4){
      ctx.fillStyle=i>h/2?td.color:lighten(td.color,.3);
      ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y-i,h*.35,h*.12,0,0,Math.PI*2);ctx.fill();
    }
    // Top dome
    ctx.fillStyle=td.color;ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y-h-3,6,3,0,0,Math.PI*2);ctx.fill();
    // Level indicator
    ctx.fillStyle="#fff";ctx.font="bold 10px sans-serif";ctx.textAlign="center";
    ctx.fillText("Lv"+t.level,p.x+TILE_W/2,p.y-h-8);
    // Range indicator for selected
    if(state.selectedTower!==null&&t.x===state.hoverCol&&t.y===state.hoverRow){
      ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.arc(p.x+TILE_W/2,p.y-h/2,t.range*TILE_W/2.5,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    }
  });

  // Draw enemies
  state.enemies.forEach(function(e){
    var p=iso(e.x,e.y);
    // Shadow
    ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y,e.size,e.size*.4,0,0,Math.PI*2);ctx.fill();
    // Body
    var h=e.size*1.5;
    ctx.fillStyle=e.color;
    ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y-h,e.size*.8,e.size*.4,0,0,Math.PI*2);ctx.fill();
    // Head
    ctx.beginPath();ctx.ellipse(p.x+TILE_W/2,p.y-h-e.size*.5,e.size*.6,e.size*.3,0,0,Math.PI*2);ctx.fill();
    // HP bar
    if(e.hp<e.maxHp){
      var bw=e.size*2,bh=4,bx=p.x+TILE_W/2-bw/2,by=p.y-h-e.size-bh-4;
      ctx.fillStyle="#333";ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle=e.hp/e.maxHp>.5?"#10b981":e.hp/e.maxHp>.25?"#f59e0b":"#ef4444";
      ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
    }
    // Slow indicator
    if(e.slow>0){ctx.fillStyle="rgba(59,130,246,.4)";ctx.beginPath();ctx.arc(p.x+TILE_W/2,p.y-h,8,0,Math.PI*2);ctx.fill()}
  });

  // Draw projectiles
  state.projectiles.forEach(function(p){
    var pp=iso(p.cx,p.cy);
    var td=TOWER_TYPES.find(function(tt){return tt.id===p.type});
    ctx.fillStyle=td.color;ctx.shadowColor=td.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(pp.x+TILE_W/2,pp.y-6,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  // Draw hover placement
  if(state.selectedTower!==null&&state.hoverCol!==undefined&&state.hoverRow!==undefined){
    var hp=iso(state.hoverCol,state.hoverRow);
    var canPlace=!state.pathSet.has(state.hoverCol+","+state.hoverRow)&&!state.towers.find(function(t){return t.x===state.hoverCol&&t.y===state.hoverRow});
    ctx.fillStyle=canPlace?"rgba(16,185,129,.3)":"rgba(239,68,68,.3)";
    ctx.beginPath();ctx.moveTo(hp.x,hp.y);ctx.lineTo(hp.x+TILE_W/2,hp.y+TILE_H/2);ctx.lineTo(hp.x+TILE_W,hp.y);ctx.lineTo(hp.x+TILE_W/2,hp.y-TILE_H/2);ctx.fill();
  }

  // Game over overlay
  if(state.gameOver){
    ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#ff6b6b";ctx.font="bold 36px sans-serif";ctx.textAlign="center";ctx.fillText("💔 游戏结束",canvas.width/2,canvas.height/2-20);
    ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.fillText("点击按钮重新开始",canvas.width/2,canvas.height/2+30);
  }
  if(state.gameWon){
    ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle="#fbbf24";ctx.font="bold 36px sans-serif";ctx.textAlign="center";ctx.fillText("🏆 恭喜通关!",canvas.width/2,canvas.height/2-20);
    ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.fillText("击杀: "+state.kills+" | 剩余生命: "+state.lives,canvas.width/2,canvas.height/2+30);
  }
}

function lighten(hex,amt){var c=parseInt(hex.slice(1),16);var r=Math.min(255,(c>>16)+60),g=Math.min(255,((c>>8)&255)+60),b=Math.min(255,(c&255)+60);return"rgb("+r+","+g+","+b+")"}

// Mouse interaction
canvas.addEventListener("mousemove",function(e){
  var rect=canvas.getBoundingClientRect();
  var mx=e.clientX-rect.left,my=e.clientY-rect.top;
  // Reverse isometric
  var closest=null,cd=Infinity;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var p=iso(c,r);var dx=mx-p.x-TILE_W/2,dy=my-p.y;var d=Math.abs(dx)+Math.abs(dy);
    if(d<cd){cd=d;closest={c:c,r:r}}
  }
  if(closest&&cd<TILE_W/2){state.hoverCol=closest.c;state.hoverRow=closest.r}else{state.hoverCol=undefined;state.hoverRow=undefined}
});

canvas.addEventListener("click",function(e){
  if(state.gameOver||state.gameWon)return;
  if(state.hoverCol===undefined)return;
  var c=state.hoverCol,r=state.hoverRow;
  var existing=state.towers.find(function(t){return t.x===c&&t.y===r});
  if(existing){upgradeTower(c,r)}else{placeTower(c,r)}
});

// Tower selection
TOWER_TYPES.forEach(function(td,i){
  var btn=document.createElement("button");
  btn.className="td-tower-btn";if(i===0)btn.classList.add("selected");
  btn.innerHTML='<div class="td-tower-icon" style="background:'+td.color+'20;color:'+td.color+'">'+td.icon+'</div><div class="td-tower-info"><div class="td-tower-name">'+td.name+'</div><div class="td-tower-cost">💰'+td.cost+' | '+td.desc+'</div></div>';
  btn.addEventListener("click",function(){
    document.querySelectorAll(".td-tower-btn").forEach(function(b){b.classList.remove("selected")});
    btn.classList.add("selected");
    state.selectedTower=i;
  });
  document.getElementById("towerList").appendChild(btn);
});
state.selectedTower=0;

// Buttons
document.getElementById("btnStart").addEventListener("click",startWave);
document.getElementById("btnSpeed").addEventListener("click",function(){
  state.speed=state.speed===1?2:state.speed===2?3:1;
  this.textContent="⏩ x"+state.speed;
});
document.getElementById("btnSave").addEventListener("click",function(){
  var save={level:state.currentLevel,gold:state.gold,lives:state.lives,kills:state.kills,wave:state.wave-1};
  localStorage.setItem("td_save",JSON.stringify(save));
  alert("💾 已存档！");
});
document.getElementById("btnLoad").addEventListener("click",function(){
  var save=localStorage.getItem("td_save");
  if(!save){alert("没有存档");return}
  var s=JSON.parse(save);
  initLevel(s.level);
  state.gold=s.gold;state.lives=s.lives;state.kills=s.kills;state.wave=s.wave;
  updateHUD();
  alert("📂 已读档！(塔需要重新建造)");
});

// Game loop
function gameLoop(){update();draw();requestAnimationFrame(gameLoop)}
initLevel(0);
gameLoop();
})();
</script>
</body>
