<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 - 橘子站</title>
<link rel="stylesheet" href="../css/style.css">
<style>
.tool-page{max-width:700px!important}
.game-wrap{text-align:center}
canvas{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);background:#1a1a2e}
.game-info{display:flex;justify-content:center;gap:30px;margin:10px 0;font-size:1rem;font-weight:700;color:var(--text)}
</style>
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回橘子站</a>
  <div class="tool-header"><h1>🔫 坦克大战</h1><p class="desc">方向键移动 · 空格射击 · 消灭敌方坦克</p></div>
  <div class="tool-body game-wrap">
    <div class="game-info">
      <span>🛡️ 生命: <span id="lives">3</span></span>
      <span>⭐ 分数: <span id="score">0</span></span>
      <span>💥 击杀: <span id="kills">0</span></span>
      <span>🏆 波次: <span id="wave">1</span></span>
    </div>
    <canvas id="game"></canvas>
    <p style="margin-top:10px;font-size:.85rem;color:var(--text-secondary)">← → ↑ ↓ 移动 | 空格射击 | P 暂停</p>
  </div>
</div>
<script>
(function(){
var c=document.getElementById("game"),ctx=c.getContext("2d");
c.width=600;c.height=600;
var TILE=40,COLS=15,ROWS=15;

var player={x:7*TILE+TILE/2,y:13*TILE+TILE/2,dir:0,speed:3,alive:true,reload:0};
var bullets=[],enemies=[],particles=[],walls=[];
var score=0,kills=0,lives=3,wave=1,gameOver=false,paused=false;
var keys={},frame=0,enemySpawnTimer=0;

// Map walls
var map=[
  "###############",
  "#   #   #     #",
  "# # # # # ### #",
  "# #   #   #   #",
  "# ### # ### # #",
  "#   # # # # # #",
  "### # # # # # #",
  "#   #   #   # #",
  "# ##### ### # #",
  "#     # #   # #",
  "##### # # ### #",
  "#   #   # #   #",
  "# # ### # # # #",
  "# #     #   # #",
  "###############"
];

function buildWalls(){
  walls=[];
  for(var r=0;r<ROWS;r++){
    for(var c=0;c<COLS;c++){
      if(map[r][c]==="#") walls.push({x:c*TILE,y:r*TILE,w:TILE,h:TILE,hp:1});
    }
  }
}
buildWalls();

function drawTank(x,y,dir,color,size){
  ctx.save();ctx.translate(x,y);
  var s=size||18;
  // Tracks
  ctx.fillStyle="#333";
  ctx.fillRect(-s,-s+4,s*2,4);ctx.fillRect(-s,s-8,s*2,4);
  // Body
  ctx.fillStyle=color;
  ctx.fillRect(-s+3,-s+8,(s-3)*2,(s-4)*2);
  // Turret
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(0,0,s*0.55,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#222";ctx.lineWidth=1.5;ctx.stroke();
  // Barrel
  ctx.fillStyle="#555";ctx.strokeStyle="#333";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,0);
  if(dir===0) ctx.lineTo(0,-s*1.2);
  else if(dir===1) ctx.lineTo(s*1.2,0);
  else if(dir===2) ctx.lineTo(0,s*1.2);
  else ctx.lineTo(-s*1.2,0);
  ctx.stroke();
  ctx.restore();
}

function spawnEnemy(){
  var sides=[{x:Math.random()*c.width,y:-30},{x:Math.random()*c.width,y:c.height+30},{x:-30,y:Math.random()*c.height},{x:c.width+30,y:Math.random()*c.height}];
  var s=sides[Math.floor(Math.random()*4)];
  var d=Math.floor(Math.random()*4);
  enemies.push({x:s.x,y:s.y,dir:d,speed:1.2+wave*0.15,alive:true,reload:0,color:"#ef4444"});
}

function shootTank(tank,isPlayer){
  var bx=tank.x,by=tank.y;
  var d=tank.dir,vx=0,vy=0;
  if(d===0) vy=-6;else if(d===1) vx=6;else if(d===2) vy=6;else vx=-6;
  bullets.push({x:bx,y:by,vx:vx,vy:vy,fromPlayer:isPlayer,life:80});
}

function update(){
  if(gameOver||paused)return;
  frame++;

  // Player movement
  if(player.alive){
    var nx=player.x,ny=player.y;
    if(keys["ArrowUp"]||keys["w"]){ny-=player.speed;player.dir=0}
    if(keys["ArrowDown"]||keys["s"]){ny+=player.speed;player.dir=2}
    if(keys["ArrowLeft"]||keys["a"]){nx-=player.speed;player.dir=3}
    if(keys["ArrowRight"]||keys["d"]){nx+=player.speed;player.dir=1}
    if(keys[" "]){if(player.reload<=0){shootTank(player,true);player.reload=15}}
    if(player.reload>0) player.reload--;

    // Wall collision
    var blocked=false;
    walls.forEach(function(w){
      if(nx-16<w.x+w.w&&nx+16>w.x&&ny-16<w.y+w.h&&ny+16>w.y) blocked=true;
    });
    if(!blocked){player.x=nx;player.y=ny}
    player.x=Math.max(18,Math.min(c.width-18,player.x));
    player.y=Math.max(18,Math.min(c.height-18,player.y));
  }

  // Enemy AI
  enemies.forEach(function(e){
    if(!e.alive)return;
    e.reload--;
    if(e.reload<=0){shootTank(e,false);e.reload=60+Math.random()*40}
    // Move towards player
    var dx=player.x-e.x,dy=player.y-e.y;
    if(Math.abs(dx)>Math.abs(dy)){e.dir=dx>0?1:3}else{e.dir=dy>0?2:0}
    var mx=e.x+(e.dir===1?e.speed:e.dir===3?-e.speed:0);
    var my=e.y+(e.dir===2?e.speed:e.dir===0?-e.speed:0);
    var blocked=false;
    walls.forEach(function(w){
      if(mx-16<w.x+w.w&&mx+16>w.x&&my-16<w.y+w.h&&my+16>w.y) blocked=true;
    });
    if(!blocked){e.x=mx;e.y=my}
    e.x=Math.max(18,Math.min(c.width-18,e.x));
    e.y=Math.max(18,Math.min(c.height-18,e.y));
  });

  // Bullets
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<0||b.x>c.width||b.y<0||b.y>c.height){bullets.splice(i,1);continue}

    // Wall hits
    var hitWall=false;
    for(var j=walls.length-1;j>=0;j--){
      if(b.x>walls[j].x&&b.x<walls[j].x+walls[j].w&&b.y>walls[j].y&&b.y<walls[j].y+walls[j].h){
        walls[j].hp--;hitWall=true;
        if(walls[j].hp<=0){explode(walls[j].x+walls[j].w/2,walls[j].y+walls[j].h/2,"#888",8);walls.splice(j,1)}
        break;
      }
    }
    if(hitWall){bullets.splice(i,1);continue}

    // Player bullet hits enemy
    if(b.fromPlayer){
      for(var j=enemies.length-1;j>=0;j--){
        if(enemies[j].alive&&Math.abs(b.x-enemies[j].x)<18&&Math.abs(b.y-enemies[j].y)<18){
          explode(enemies[j].x,enemies[j].y,"#ff4444",20);
          enemies[j].alive=false;kills++;score+=100;
          document.getElementById("kills").textContent=kills;
          document.getElementById("score").textContent=score;
          bullets.splice(i,1);break;
        }
      }
    }else{
      // Enemy bullet hits player
      if(player.alive&&Math.abs(b.x-player.x)<18&&Math.abs(b.y-player.y)<18){
        explode(player.x,player.y,"#ff8800",25);
        lives--;document.getElementById("lives").textContent=lives;
        bullets.splice(i,1);
        if(lives<=0){gameOver=true;player.alive=false}
      }
    }
  }

  // Remove dead enemies
  enemies=enemies.filter(function(e){return e.alive});

  // Spawn enemies
  enemySpawnTimer++;
  var maxEnemies=3+wave;
  if(enemySpawnTimer>80&&enemies.length<maxEnemies){enemySpawnTimer=0;spawnEnemy()}

  // Next wave
  if(enemies.length===0&&kills>=wave*3){
    wave++;document.getElementById("wave").textContent=wave;
    for(var i=0;i<wave+2;i++) spawnEnemy();
    buildWalls();
  }

  // Particles
  for(var i=particles.length-1;i>=0;i--){
    particles[i].x+=particles[i].vx;particles[i].y+=particles[i].vy;particles[i].life--;
    if(particles[i].life<=0) particles.splice(i,1);
  }
}

function explode(x,y,color,count){
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2,v=Math.random()*3+1;
    particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:15+Math.random()*15,color:color,r:Math.random()*3+1});
  }
}

function draw(){
  ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,c.width,c.height);

  // Grid
  ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=0.5;
  for(var i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*TILE,0);ctx.lineTo(i*TILE,c.height);ctx.stroke()}
  for(var i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*TILE);ctx.lineTo(c.width,i*TILE);ctx.stroke()}

  // Walls
  walls.forEach(function(w){
    ctx.fillStyle="#475569";ctx.fillRect(w.x+2,w.y+2,w.w-4,w.h-4);
    ctx.strokeStyle="#64748b";ctx.lineWidth=2;ctx.strokeRect(w.x+2,w.y+2,w.w-4,w.h-4);
  });

  // Particles
  particles.forEach(function(p){ctx.fillStyle=p.color;ctx.globalAlpha=p.life/30;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;

  // Bullets
  bullets.forEach(function(b){ctx.fillStyle=b.fromPlayer?"#fbbf24":"#ef4444";ctx.shadowColor=b.fromPlayer?"#fbbf24":"#ef4444";ctx.shadowBlur=6;ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});

  // Enemies
  enemies.forEach(function(e){if(e.alive) drawTank(e.x,e.y,e.dir,e.color,16)});

  // Player
  if(player.alive) drawTank(player.x,player.y,player.dir,"#3b82f6",18);

  // Overlays
  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="#ef4444";ctx.font="bold 36px sans-serif";ctx.textAlign="center";ctx.fillText("游戏结束",c.width/2,c.height/2-20);
    ctx.fillStyle="white";ctx.font="18px sans-serif";ctx.fillText("分数: "+score+" | 波次: "+wave,c.width/2,c.height/2+25);
    ctx.fillText("点击重新开始",c.width/2,c.height/2+55);
  }
  if(paused&&!gameOver){
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="white";ctx.font="bold 30px sans-serif";ctx.textAlign="center";ctx.fillText("暂停中",c.width/2,c.height/2);
  }
}

function reset(){
  player={x:7*TILE+TILE/2,y:13*TILE+TILE/2,dir:0,speed:3,alive:true,reload:0};
  bullets=[];enemies=[];particles=[];
  score=0;kills=0;lives=3;wave=1;gameOver=false;paused=false;frame=0;enemySpawnTimer=0;
  buildWalls();
  for(var i=0;i<3;i++) spawnEnemy();
  document.getElementById("score").textContent="0";
  document.getElementById("kills").textContent="0";
  document.getElementById("lives").textContent="3";
  document.getElementById("wave").textContent="1";
}

document.addEventListener("keydown",function(e){keys[e.key]=true;if(e.key===" "){e.preventDefault()}if(e.key==="p"||e.key==="P"){paused=!paused}});
document.addEventListener("keyup",function(e){keys[e.key]=false});
c.addEventListener("click",function(){if(gameOver)reset()});

for(var i=0;i<3;i++) spawnEnemy();

function loop(){update();draw();requestAnimationFrame(loop)}
loop();
})();
</script>
<script src="../js/music-player.js?v=175807"></script>
<script src="../js/ambient-effects.js?v=175807"></script>
<script src="../js/theme-switcher.js?v=175807"></script>
<script src="../js/web-pet.js?v=175807"></script>
<script src="../js/easter-eggs.js?v=175807"></script>
</body>
</html>
