<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 - 在线工具箱</title>
<link rel="stylesheet" href="../css/style.css">
<style>
:root { --game-bg: #0f0f23; --food: #ff6b6b; --snake-head: #51cf66; --snake-body: #40c057; }
.game-wrap { text-align:center; }
canvas { display:block; margin:0 auto; border-radius:12px; box-shadow:0 0 40px rgba(81,207,102,.15); }
.game-ui { display:flex; justify-content:center; gap:40px; margin-bottom:16px; flex-wrap:wrap; }
.score-box { text-align:center; }
.score-val { font-size:2rem; font-weight:800; color:var(--primary); }
.score-lbl { font-size:.8rem; color:var(--text-secondary); }
.game-controls { margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.hint { color:var(--text-secondary); font-size:.85rem; margin-top:10px; }
</style>
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回工具箱</a>
  <div class="tool-header"><h1>🐍 贪吃蛇</h1><p class="desc">经典街机游戏 · 方向键控制 · 吃得越多越长</p></div>
  <div class="tool-body">
    <div class="game-wrap">
      <div class="game-ui">
        <div class="score-box"><div class="score-val" id="score">0</div><div class="score-lbl">得分</div></div>
        <div class="score-box"><div class="score-val" id="best">0</div><div class="score-lbl">最高分</div></div>
      </div>
      <canvas id="canvas"></canvas>
      <div class="game-controls">
        <button class="btn btn-primary" id="btnStart">▶ 开始游戏</button>
        <button class="btn btn-secondary" id="btnPause">⏸ 暂停</button>
      </div>
      <p class="hint">方向键 ↑ ↓ ← → 控制移动 · 空格键暂停</p>
    </div>
  </div>
  <div class="ad-slot">📢 广告位</div>
</div>

<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary);text-align:center">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script>
(function(){
var canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
var scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
var btnStart=document.getElementById("btnStart"),btnPause=document.getElementById("btnPause");
var grid=20,cols,rows,snake,food,dir,nextDir,score,best=0,gameLoop,paused=false,running=false;
var particles=[];
var colors=["#51cf66","#40c057","#69db7c","#2f9e44","#37b24d"];

function resize(){
  var w=Math.min(600,window.innerWidth-48);
  canvas.width=Math.floor(w/grid)*grid;canvas.height=canvas.width;
  cols=canvas.width/grid;rows=canvas.height/grid;
}

function init(){
  resize();
  var cx=Math.floor(cols/2),cy=Math.floor(rows/2);
  snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;particles=[];scoreEl.textContent="0";
  best=parseInt(localStorage.getItem("snakeBest")||"0");
  bestEl.textContent=best;
  spawnFood();
}

function spawnFood(){
  var taken={};snake.forEach(function(s){taken[s.x+","+s.y]=true});
  var free=[];for(var x=0;x<cols;x++)for(var y=0;y<rows;y++)if(!taken[x+","+y])free.push({x:x,y:y});
  food=free[Math.floor(Math.random()*free.length)];
}

function spawnParticles(x,y){
  for(var i=0;i<12;i++){
    particles.push({x:x,y:y,vx:(Math.random()-.5)*4,vy:(Math.random()-.5)*4,life:1,size:2+Math.random()*3,color:colors[Math.floor(Math.random()*colors.length)]});
  }
}

function update(){
  if(!running||paused)return;
  dir={x:nextDir.x,y:nextDir.y};
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){gameOver();return}
  for(var i=0;i<snake.length;i++)if(snake[i].x===head.x&&snake[i].y===head.y){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;scoreEl.textContent=score;
    spawnParticles(food.x,food.y);
    spawnFood();
  }else{snake.pop()}
  for(var j=particles.length-1;j>=0;j--){
    particles[j].x+=particles[j].vx;particles[j].y+=particles[j].vy;
    particles[j].life-=.03;if(particles[j].life<=0)particles.splice(j,1);
  }
}

function draw(){
  ctx.fillStyle="#0f0f23";ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid lines
  ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=.5;
  for(var x=0;x<cols;x++){ctx.beginPath();ctx.moveTo(x*grid,0);ctx.lineTo(x*grid,canvas.height);ctx.stroke()}
  for(var y=0;y<rows;y++){ctx.beginPath();ctx.moveTo(0,y*grid);ctx.lineTo(canvas.width,y*grid);ctx.stroke()}
  // Food with glow
  var fx=food.x*grid+grid/2,fy=food.y*grid+grid/2;
  ctx.shadowColor="#ff6b6b";ctx.shadowBlur=15;
  ctx.fillStyle="#ff6b6b";ctx.beginPath();ctx.arc(fx,fy,grid/2-2,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.4)";ctx.beginPath();ctx.arc(fx-2,fy-2,3,0,Math.PI*2);ctx.fill();
  // Snake
  for(var i=snake.length-1;i>=0;i--){
    var s=snake[i],sx=s.x*grid,sy=s.y*grid;
    var ratio=1-i/snake.length;
    var r=grid/2-2;
    if(i===0){
      ctx.fillStyle=colors[0];ctx.shadowColor=colors[0];ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(sx+grid/2,sy+grid/2,r,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      // Eyes
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(sx+grid/2+dir.x*5-3,sy+grid/2+dir.y*5-2,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+grid/2+dir.x*5+3,sy+grid/2+dir.y*5-2,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#0f0f23";ctx.beginPath();ctx.arc(sx+grid/2+dir.x*5-2,sy+grid/2+dir.y*5-2,1.2,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(sx+grid/2+dir.x*5+4,sy+grid/2+dir.y*5-2,1.2,0,Math.PI*2);ctx.fill();
    }else{
      var ci=Math.floor(i/2)%colors.length;
      ctx.fillStyle=colors[ci];
      ctx.beginPath();ctx.arc(sx+grid/2,sy+grid/2,r,0,Math.PI*2);ctx.fill();
    }
  }
  // Particles
  particles.forEach(function(p){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x*grid+grid/2,p.y*grid+grid/2,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  if(paused){ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.font="bold 28px sans-serif";ctx.textAlign="center";ctx.fillText("暂停中",canvas.width/2,canvas.height/2)}
}

function gameOver(){
  running=false;clearInterval(gameLoop);
  if(score>best){best=score;localStorage.setItem("snakeBest",best);bestEl.textContent=best}
  btnStart.textContent="🔄 再来一局";
  ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#ff6b6b";ctx.font="bold 32px sans-serif";ctx.textAlign="center";ctx.fillText("游戏结束",canvas.width/2,canvas.height/2-10);
  ctx.fillStyle="#fff";ctx.font="16px sans-serif";ctx.fillText("得分: "+score+" | 最高: "+best,canvas.width/2,canvas.height/2+30);
}

function startGame(){
  init();running=true;paused=false;btnStart.textContent="🔄 重新开始";btnPause.textContent="⏸ 暂停";
  clearInterval(gameLoop);gameLoop=setInterval(function(){update();draw()},100);
}

function togglePause(){
  if(!running)return;
  paused=!paused;btnPause.textContent=paused?"▶ 继续":"⏸ 暂停";
}

btnStart.addEventListener("click",startGame);
btnPause.addEventListener("click",togglePause);
document.addEventListener("keydown",function(e){
  if(!running)return;
  if(e.code==="Space"){e.preventDefault();togglePause();return}
  if(paused)return;
  if((e.code==="ArrowUp"||e.code==="KeyW")&&dir.y!==1){nextDir={x:0,y:-1}}else
  if((e.code==="ArrowDown"||e.code==="KeyS")&&dir.y!==-1){nextDir={x:0,y:1}}else
  if((e.code==="ArrowLeft"||e.code==="KeyA")&&dir.x!==1){nextDir={x:-1,y:0}}else
  if((e.code==="ArrowRight"||e.code==="KeyD")&&dir.x!==-1){nextDir={x:1,y:0}}
});
window.addEventListener("resize",function(){if(!running){resize();draw();init()}});

// Touch controls
var touchStartX=0,touchStartY=0;
canvas.addEventListener("touchstart",function(e){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;e.preventDefault()});
canvas.addEventListener("touchmove",function(e){e.preventDefault()});
canvas.addEventListener("touchend",function(e){
  if(!running||paused)return;
  var dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy)){
    if(dx>20&&dir.x!==-1)nextDir={x:1,y:0};
    else if(dx<-20&&dir.x!==1)nextDir={x:-1,y:0};
  }else{
    if(dy>20&&dir.y!==-1)nextDir={x:0,y:1};
    else if(dy<-20&&dir.y!==1)nextDir={x:0,y:-1};
  }
});

resize();init();draw();
})();
</script>
<script src="../js/music-player.js"></script>
</body>
</html>
