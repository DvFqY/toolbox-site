<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URL 编解码 - 在线工具箱</title>
<meta name="description" content="在线 URL 编码解码工具，处理 URL 中的特殊字符和中文参数。">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回工具箱</a>
  <div class="tool-header"><h1>URL 编解码</h1><p class="desc">URL Encode / Decode，处理 URL 中特殊字符和中文参数</p></div>
  <div class="tool-body">
    <div class="form-group"><label>输入文本或 URL</label><textarea id="input" placeholder="输入要编码或解码的 URL 文本..."></textarea></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="doEncode()">🔒 URL 编码 (Encode)</button>
      <button class="btn btn-secondary" onclick="doDecode()">🔓 URL 解码 (Decode)</button>
      <button class="btn btn-secondary" onclick="doEncodeAll()">🔐 完整编码 (含特殊字符)</button>
      <button class="btn btn-secondary" onclick="clearAll()">🗑 清空</button>
    </div>
    <div class="result-label">输出 <button class="copy-btn" onclick="copyResult()">📋 复制</button></div>
    <div class="result-area" id="output"></div>
  </div>
  <div class="ad-slot">📢 广告位</div>
</div>
<script>
var inEl=document.getElementById("input"),out=document.getElementById("output");
function doEncode(){out.textContent=encodeURIComponent(inEl.value)}
function doDecode(){try{out.textContent=decodeURIComponent(inEl.value)}catch(e){out.textContent="解码失败："+e.message}}
function doEncodeAll(){out.textContent=encodeURIComponent(inEl.value).replace(/[!'()*]/g,function(c){return"%27".repeat(c==="`"`?1:0)||"%"+c.charCodeAt(0).toString(16).toUpperCase()})}
function clearAll(){inEl.value="";out.textContent=""}
function copyResult(){var t=out.textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="✅ 已复制";b.classList.add("copied");setTimeout(function(){b.textContent="📋 复制";b.classList.remove("copied")},2000)})}
</script>

<!-- 访问统计 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · 
  <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
