<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a>
  <div class="tool-header"><h1>URL 缂栬В鐮?/h1><p class="desc">URL Encode / Decode锛屽鐞?URL 涓壒娈婂瓧绗﹀拰涓枃鍙傛暟</p></div>
  <div class="tool-body">
    <div class="form-group"><label>杈撳叆鏂囨湰鎴?URL</label><textarea id="input" placeholder="杈撳叆瑕佺紪鐮佹垨瑙ｇ爜鐨?URL 鏂囨湰..."></textarea></div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="doEncode()">馃敀 URL 缂栫爜 (Encode)</button>
      <button class="btn btn-secondary" onclick="doDecode()">馃敁 URL 瑙ｇ爜 (Decode)</button>
      <button class="btn btn-secondary" onclick="doEncodeAll()">馃攼 瀹屾暣缂栫爜 (鍚壒娈婂瓧绗?</button>
      <button class="btn btn-secondary" onclick="clearAll()">馃棏 娓呯┖</button>
    </div>
    <div class="result-label">杈撳嚭 <button class="copy-btn" onclick="copyResult()">馃搵 澶嶅埗</button></div>
    <div class="result-area" id="output"></div>
  </div>
  <div class="ad-slot">馃摙 骞垮憡浣?/div>
</div>
<script>
var inEl=document.getElementById("input"),out=document.getElementById("output");
function doEncode(){out.textContent=encodeURIComponent(inEl.value)}
function doDecode(){try{out.textContent=decodeURIComponent(inEl.value)}catch(e){out.textContent="瑙ｇ爜澶辫触锛?+e.message}}
function doEncodeAll(){out.textContent=encodeURIComponent(inEl.value).replace(/[!'()*]/g,function(c){return"%27".repeat(c==="`"`?1:0)||"%"+c.charCodeAt(0).toString(16).toUpperCase()})}
function clearAll(){inEl.value="";out.textContent=""}
function copyResult(){var t=out.textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="鉁?宸插鍒?;b.classList.add("copied");setTimeout(function(){b.textContent="馃搵 澶嶅埗";b.classList.remove("copied")},2000)})}
</script>

<!-- 璁块棶缁熻 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>馃憖 鏈珯鎬昏闂?<span id="busuanzi_value_site_pv"></span> 娆?路 
  <span id="busuanzi_value_site_uv"></span> 浜?/span>
