<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 鏍煎紡鍖?- 鍦ㄧ嚎宸ュ叿绠?/title>
<meta name="description" content="鍦ㄧ嚎 JSON 鏍煎紡鍖栧伐鍏凤細鏍煎紡鍖栥€佸帇缂┿€侀獙璇?JSON 鏁版嵁锛屾敮鎸佽娉曢珮浜拰閿欒鎻愮ず锛屼繚鎶ゆ暟鎹殣绉併€?>
<link rel="stylesheet" href="../css/style.css">
<style>
.json-key { color: #0550ae; }
.json-string { color: #0a3069; }
.json-number { color: #cf222e; }
.json-boolean { color: #8250df; }
.json-null { color: #6e7781; }
.json-bracket { color: #1f2328; }
</style>
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a>
  <div class="tool-header">
    <h1>JSON 鏍煎紡鍖?/h1>
    <p class="desc">鏍煎紡鍖栥€佸帇缂┿€侀獙璇?JSON 鏁版嵁锛岃嚜鍔ㄨ娉曢珮浜?/p>
  </div>
  <div class="tool-body">
    <div class="form-group">
      <label>杈撳叆 JSON 鏂囨湰</label>
      <textarea id="input" placeholder='{"name":"鍦ㄧ嚎宸ュ叿绠?,"tools":["json","base64"]}'></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="formatJSON()">鉁?鏍煎紡鍖?/button>
      <button class="btn btn-secondary" onclick="compressJSON()">馃摝 鍘嬬缉</button>
      <button class="btn btn-secondary" onclick="validateJSON()">鉁?楠岃瘉</button>
      <button class="btn btn-secondary" onclick="clearAll()">馃棏 娓呯┖</button>
    </div>
    <div id="error" style="color:var(--danger);margin-top:12px;font-size:.9rem;"></div>
    <div class="result-label">杈撳嚭缁撴灉 <button class="copy-btn" onclick="copyResult()">馃搵 澶嶅埗</button></div>
    <div class="result-area" id="output"></div>
  </div>
  <div class="ad-slot">馃摙 骞垮憡浣?/div>
</div>
<script>
var input = document.getElementById("input");
var output = document.getElementById("output");
var errorDiv = document.getElementById("error");

function syntaxHighlight(json) {
  json = json.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^"\\])*"(s*:)?|\b(true|false|null)b|-?d+(?:.d*)?(?:[eE][+-]?d+)?)/g, function(match) {
    var cls = "json-number";
    if (/^"/.test(match)) {
      if (/:$/.test(match)) { cls = "json-key"; } else { cls = "json-string"; }
    } else if (/true|false/.test(match)) { cls = "json-boolean"; }
    else if (/null/.test(match)) { cls = "json-null"; }
    return '<span class="' + cls + '">' + match + "</span>";
  });
}

function formatJSON() {
  errorDiv.textContent = "";
  output.innerHTML = "";
  try {
    var obj = JSON.parse(input.value);
    var formatted = JSON.stringify(obj, null, 2);
    output.innerHTML = syntaxHighlight(formatted);
  } catch (e) {
    errorDiv.textContent = "鉂?JSON 瑙ｆ瀽閿欒锛? + e.message;
  }
}

function compressJSON() {
  errorDiv.textContent = "";
  output.innerHTML = "";
  try {
    var obj = JSON.parse(input.value);
    output.textContent = JSON.stringify(obj);
  } catch (e) {
    errorDiv.textContent = "鉂?JSON 瑙ｆ瀽閿欒锛? + e.message;
  }
}

function validateJSON() {
  errorDiv.textContent = "";
  output.innerHTML = "";
  try {
    JSON.parse(input.value);
    errorDiv.textContent = "鉁?JSON 鏍煎紡姝ｇ‘锛?;
    errorDiv.style.color = "var(--success)";
  } catch (e) {
    errorDiv.textContent = "鉂?JSON 瑙ｆ瀽閿欒锛? + e.message;
    errorDiv.style.color = "var(--danger)";
  }
}

function clearAll() { input.value = ""; output.innerHTML = ""; errorDiv.textContent = ""; }

function copyResult() {
  var text = output.textContent;
  if (!text) return;
  navigator.clipboard.writeText(text).then(function() {
    var btn = event.target;
    btn.textContent = "鉁?宸插鍒?;
    btn.classList.add("copied");
    setTimeout(function() { btn.textContent = "馃搵 澶嶅埗"; btn.classList.remove("copied"); }, 2000);
  });
}
</script>

<!-- 璁块棶缁熻 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>馃憖 鏈珯鎬昏闂?<span id="busuanzi_value_site_pv"></span> 娆?路 
  <span id="busuanzi_value_site_uv"></span> 浜?/span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
