<meta name="description" content="在线随机数生成器：生成指定范围内随机数，支持整数小数、批量生成、不重复。">

<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回橘子站</a>
  <div class="tool-header"><h1>随机数生成器</h1><p class="desc">生成指定范围内的随机数，支持整数、小数、批量生成</p></div>
  <div class="tool-body">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="form-group"><label>最小值</label><input type="number" id="min" value="1"></div>
      <div class="form-group"><label>最大值</label><input type="number" id="max" value="100"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
      <div class="form-group"><label>生成数量</label><input type="number" id="count" value="5" min="1" max="1000"></div>
      <div class="form-group"><label>小数位数</label><input type="number" id="decimals" value="0" min="0" max="10"></div>
    </div>
    <div style="margin-bottom:16px;display:flex;gap:16px;flex-wrap:wrap">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="unique"> 不重复</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="sortAsc"> 升序排列</label>
    </div>
    <div class="btn-group"><button class="btn btn-primary" onclick="generate()">🎲 生成随机数</button><button class="btn btn-secondary" onclick="copyResult()">📋 复制</button></div>
    <div class="result-area" id="output" style="margin-top:16px;font-size:1.1rem"></div>
    <div style="margin-top:8px;font-size:.85rem;color:var(--text-secondary)" id="stats"></div>
  </div>
  <div class="ad-slot">📢 广告位</div>
</div>
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary);text-align:center">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script>
function generate(){
  var min=parseFloat(document.getElementById("min").value)||0;
  var max=parseFloat(document.getElementById("max").value)||100;
  var count=parseInt(document.getElementById("count").value)||5;
  var dec=parseInt(document.getElementById("decimals").value)||0;
  var unique=document.getElementById("unique").checked;
  var sortAsc=document.getElementById("sortAsc").checked;
  var out=document.getElementById("output"),stats=document.getElementById("stats");
  if(min>max){var t=min;min=max;max=t}
  var range=max-min;
  if(unique&&dec===0&&count>range+1){out.textContent="不重复整数数量不能超过范围大小";stats.textContent="";return}
  var results=[],seen=new Set();
  var mult=Math.pow(10,dec);
  while(results.length<count){
    var r=Math.random()*(max-min)+min;
    r=Math.round(r*mult)/mult;
    if(unique){var key=r;if(seen.has(key))continue;seen.add(key)}
    results.push(r);
  }
  if(sortAsc)results.sort(function(a,b){return a-b});
  out.textContent=results.join(dec===0?", ":"\n");
  stats.textContent="生成了 "+count+" 个随机数"+(unique?" (不重复)":"")+(sortAsc?" (升序)":"");
}
function copyResult(){var t=document.getElementById("output").textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="✅ 已复制";setTimeout(function(){b.textContent="📋 复制"},2000)})}
</script>
