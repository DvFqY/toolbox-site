<div class="tool-page"><a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a><div class="tool-header"><h1>CSS 鍘嬬缉</h1><p class="desc">鍘嬬缉 CSS 浠ｇ爜锛岀Щ闄ゆ敞閲婂拰澶氫綑绌虹櫧</p></div>
<div class="tool-body">
<div class="form-group"><label>杈撳叆 CSS</label><textarea id="input" placeholder="绮樿创 CSS 浠ｇ爜...">body {
  margin: 0;
  padding: 0;
  /* 杩欐槸涓€涓敞閲?*/
  font-family: Arial, sans-serif;
}</textarea></div>
<div class="btn-group"><button class="btn btn-primary" onclick="minify()">馃摝 鍘嬬缉 CSS</button><button class="btn btn-secondary" onclick="copyOut()">馃搵 澶嶅埗缁撴灉</button></div>
<div id="stats" style="margin-top:12px;font-size:.85rem;color:var(--text-secondary)"></div>
<div class="result-area" id="output" style="margin-top:12px"></div></div><div class="ad-slot">馃摙 骞垮憡浣?/div></div>
<script>
function minify(){var css=document.getElementById("input").value;
var original=css.length;
css=css.replace(/\/\*[s\S]*?\*\//g,"");
css=css.replace(/s+/g," ");
css=css.replace(/s*{s*/g,"{");
css=css.replace(/s*}s*/g,"}");
css=css.replace(/s*;s*/g,";");
css=css.replace(/s*:s*/g,":");
css=css.replace(/s*,s*/g,",");
css=css.replace(/;}/g,"}");
css=css.trim();
var minified=css.length;
document.getElementById("output").textContent=css;
document.getElementById("stats").innerHTML="鍘熷澶у皬: <b>"+original+"</b> bytes 鈫?鍘嬬缉鍚? <b>"+minified+"</b> bytes (鑺傜渷 <b>"+Math.round((1-minified/original)*100)+"%</b>)";
}
function copyOut(){var t=document.getElementById("output").textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="鉁?宸插鍒?;setTimeout(function(){b.textContent="馃搵 澶嶅埗缁撴灉"},2000)})}
</script>
