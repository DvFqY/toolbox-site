<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CSS 压缩 - 在线工具箱</title><meta name="description" content="在线 CSS 压缩工具，移除注释和空白，减小文件体积。"><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="tool-page"><a href="../index.html" class="back-link">← 返回工具箱</a><div class="tool-header"><h1>CSS 压缩</h1><p class="desc">压缩 CSS 代码，移除注释和多余空白</p></div>
<div class="tool-body">
<div class="form-group"><label>输入 CSS</label><textarea id="input" placeholder="粘贴 CSS 代码...">body {
  margin: 0;
  padding: 0;
  /* 这是一个注释 */
  font-family: Arial, sans-serif;
}</textarea></div>
<div class="btn-group"><button class="btn btn-primary" onclick="minify()">📦 压缩 CSS</button><button class="btn btn-secondary" onclick="copyOut()">📋 复制结果</button></div>
<div id="stats" style="margin-top:12px;font-size:.85rem;color:var(--text-secondary)"></div>
<div class="result-area" id="output" style="margin-top:12px"></div></div><div class="ad-slot">📢 广告位</div></div>
<script>
function minify(){var css=document.getElementById("input").value;
var original=css.length;
css=css.replace(/\/\*[s\S]*?\*\//g,"");
css=css.replace(/s+/g," ");
css=css.replace(/s*{s*/g,"{");
css=css.replace(/s*}s*/g,"}");
css=css.replace(/s*;s*/g,";");
css=css.replace(/s*:s*/g,":");
css=css.replace(/s*,s*/g,",");
css=css.replace(/;}/g,"}");
css=css.trim();
var minified=css.length;
document.getElementById("output").textContent=css;
document.getElementById("stats").innerHTML="原始大小: <b>"+original+"</b> bytes → 压缩后: <b>"+minified+"</b> bytes (节省 <b>"+Math.round((1-minified/original)*100)+"%</b>)";
}
function copyOut(){var t=document.getElementById("output").textContent;if(!t)return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="✅ 已复制";setTimeout(function(){b.textContent="📋 复制结果"},2000)})}
</script>
<!-- 访问统计 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · 
  <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

<script src="../js/easter-eggs.js?v=190307"></script>
</body></html>
