<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瀵嗙爜鐢熸垚鍣?- 鍦ㄧ嚎宸ュ叿绠?/title>
<meta name="description" content="鍦ㄧ嚎闅忔満瀵嗙爜鐢熸垚鍣紝鑷畾涔夐暱搴﹀拰瀛楃绫诲瀷锛岀敓鎴愰珮寮哄害瀵嗙爜銆?>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a>
  <div class="tool-header"><h1>瀵嗙爜鐢熸垚鍣?/h1><p class="desc">鐢熸垚楂樺己搴﹂殢鏈哄瘑鐮侊紝鑷畾涔夐暱搴﹀拰瀛楃绫诲瀷</p></div>
  <div class="tool-body">
    <div class="form-group"><label>瀵嗙爜闀垮害</label><input type="number" id="length" value="16" min="4" max="128" style="max-width:200px"></div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="upper" checked> 澶у啓瀛楁瘝 A-Z</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="lower" checked> 灏忓啓瀛楁瘝 a-z</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="number" checked> 鏁板瓧 0-9</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="symbol"> 鐗规畩瀛楃 !@#$</label>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="generate()">馃幉 鐢熸垚瀵嗙爜</button>
      <button class="btn btn-secondary" onclick="copyPwd()">馃搵 澶嶅埗</button>
    </div>
    <div class="password-display" id="output" style="margin-top:16px">鐐瑰嚮鐢熸垚瀵嗙爜</div>
    <div style="margin-top:10px;font-size:.8rem;color:var(--text-secondary)" id="strength"></div>
  </div>
  <div class="ad-slot">馃摙 骞垮憡浣?/div>
</div>
<script>
var elOut=document.getElementById("output"),elStr=document.getElementById("strength");
function generate(){
  var len=parseInt(document.getElementById("length").value)||16;
  var chars="";
  if(document.getElementById("upper").checked)chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if(document.getElementById("lower").checked)chars+="abcdefghijklmnopqrstuvwxyz";
  if(document.getElementById("number").checked)chars+="0123456789";
  if(document.getElementById("symbol").checked)chars+="!@#$%^&*()_+-=[]{}|;:,.<>?";
  if(!chars){elOut.textContent="璇疯嚦灏戦€夋嫨涓€绉嶅瓧绗︾被鍨?;elStr.textContent="";return}
  var pwd="";for(var i=0;i<len;i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
  elOut.textContent=pwd;
  if(len>=16&&chars.length>60)elStr.textContent="馃敀 寮哄害锛氶潪甯稿己";
  else if(len>=12)elStr.textContent="馃敀 寮哄害锛氬己";
  else if(len>=8)elStr.textContent="馃敁 寮哄害锛氫腑绛?;
  else elStr.textContent="鈿狅笍 寮哄害锛氬急锛屽缓璁鍔犻暱搴?;
}
function copyPwd(){var t=elOut.textContent;if(!t||t==="鐐瑰嚮鐢熸垚瀵嗙爜")return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="鉁?宸插鍒?;setTimeout(function(){b.textContent="馃搵 澶嶅埗"},2000)})}
</script>

<!-- 璁块棶缁熻 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>馃憖 鏈珯鎬昏闂?<span id="busuanzi_value_site_pv"></span> 娆?路 
  <span id="busuanzi_value_site_uv"></span> 浜?/span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
