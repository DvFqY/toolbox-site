<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - 在线工具箱</title>
<meta name="description" content="在线随机密码生成器，自定义长度和字符类型，生成高强度密码。">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回橘子站</a>
  <div class="tool-header"><h1>密码生成器</h1><p class="desc">生成高强度随机密码，自定义长度和字符类型</p></div>
  <div class="tool-body">
    <div class="form-group"><label>密码长度</label><input type="number" id="length" value="16" min="4" max="128" style="max-width:200px"></div>
    <div style="display:flex;flex-wrap:wrap;gap:16px;margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="upper" checked> 大写字母 A-Z</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="lower" checked> 小写字母 a-z</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="number" checked> 数字 0-9</label>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="symbol"> 特殊字符 !@#$</label>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="generate()">🎲 生成密码</button>
      <button class="btn btn-secondary" onclick="copyPwd()">📋 复制</button>
    </div>
    <div class="password-display" id="output" style="margin-top:16px">点击生成密码</div>
    <div style="margin-top:10px;font-size:.8rem;color:var(--text-secondary)" id="strength"></div>
  </div>
  <div class="ad-slot">📢 广告位</div>
</div>
<script>
var elOut=document.getElementById("output"),elStr=document.getElementById("strength");
function generate(){
  var len=parseInt(document.getElementById("length").value)||16;
  var chars="";
  if(document.getElementById("upper").checked)chars+="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  if(document.getElementById("lower").checked)chars+="abcdefghijklmnopqrstuvwxyz";
  if(document.getElementById("number").checked)chars+="0123456789";
  if(document.getElementById("symbol").checked)chars+="!@#$%^&*()_+-=[]{}|;:,.<>?";
  if(!chars){elOut.textContent="请至少选择一种字符类型";elStr.textContent="";return}
  var pwd="";for(var i=0;i<len;i++)pwd+=chars[Math.floor(Math.random()*chars.length)];
  elOut.textContent=pwd;
  if(len>=16&&chars.length>60)elStr.textContent="🔒 强度：非常强";
  else if(len>=12)elStr.textContent="🔒 强度：强";
  else if(len>=8)elStr.textContent="🔓 强度：中等";
  else elStr.textContent="⚠️ 强度：弱，建议增加长度";
}
function copyPwd(){var t=elOut.textContent;if(!t||t==="点击生成密码")return;navigator.clipboard.writeText(t).then(function(){var b=event.target;b.textContent="✅ 已复制";setTimeout(function(){b.textContent="📋 复制"},2000)})}
</script>

<!-- 访问统计 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · 
  <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="../js/music-player.js?v=173601"></script>
<script src="../js/ambient-effects.js?v=173601"></script>
<script src="../js/theme-switcher.js?v=173601"></script>
<script src="../js/web-pet.js?v=173601"></script>
<script src="../js/easter-eggs.js?v=173601"></script>





<!-- 网易云音乐 Lucky 播放器 -->
<div id="neteaseWrap" style="position:fixed;bottom:20px;left:20px;z-index:999999">
  <div id="neteasePanel" style="display:none;width:330px;background:rgba(255,255,255,.95);border-radius:14px;border:1px solid #fed7aa;box-shadow:0 8px 32px rgba(249,115,22,.2);overflow:hidden;margin-bottom:8px">
    <div style="background:linear-gradient(135deg,#f97316,#ea580c);padding:10px 16px;display:flex;align-items:center;justify-content:space-between">
      <span style="color:white;font-weight:700;font-size:.9rem">🍊 Lucky - 徐梦圆</span>
      <span onclick="document.getElementById('neteasePanel').style.display='none';document.getElementById('neteaseBtn').textContent='🎵'" style="color:rgba(255,255,255,.7);cursor:pointer;font-size:1.1rem">✕</span>
    </div>
    <div style="padding:8px 12px 12px">
      <iframe id="neteaseIframe" src="https://music.163.com/outchain/player?type=2&id=536098339&auto=0&height=66" style="width:100%;height:66px;border:none;border-radius:6px" allow="autoplay"></iframe>
    </div>
    <div style="padding:6px 16px;font-size:.75rem;color:#9a3412;text-align:center;border-top:1px solid #fed7aa;background:#fffbeb">点击 ▶ 播放 · 纯音乐</div>
  </div>
  <div id="neteaseBtn" onclick="var p=document.getElementById('neteasePanel');var b=this;if(p.style.display=='none'){p.style.display='block';b.textContent='✕';document.getElementById('neteaseIframe').src='https://music.163.com/outchain/player?type=2&id=536098339&auto=1&height=66'}else{p.style.display='none';b.textContent='🎵'}" style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);border:2px solid #fed7aa;display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;box-shadow:0 2px 12px rgba(249,115,22,.3);user-select:none">🎵</div>
</div>
</body>
</html>
