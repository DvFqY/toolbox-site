<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Markdown 预览 - 在线工具箱</title><meta name="description" content="在线 Markdown 实时预览工具，支持 GitHub 风格 Markdown，写作 README 必备。"><link rel="stylesheet" href="../css/style.css"><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><style>
.markdown-body{font-size:.95rem;line-height:1.8;color:var(--text)}
.markdown-body h1,.markdown-body h2,.markdown-body h3{margin-top:20px;margin-bottom:10px;font-weight:600}
.markdown-body h1{font-size:1.6rem;border-bottom:2px solid var(--border);padding-bottom:8px}
.markdown-body h2{font-size:1.3rem;border-bottom:1px solid var(--border);padding-bottom:6px}
.markdown-body code{background:var(--bg);padding:2px 6px;border-radius:4px;font-size:.88em;font-family:"SF Mono","Consolas",monospace}
.markdown-body pre{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:var(--radius-sm);overflow-x:auto;margin:12px 0}
.markdown-body pre code{background:none;padding:0;color:inherit}
.markdown-body blockquote{border-left:4px solid var(--primary);padding:8px 16px;margin:12px 0;background:var(--primary-light);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.markdown-body table{border-collapse:collapse;width:100%;margin:12px 0}
.markdown-body th,.markdown-body td{border:1px solid var(--border);padding:8px 12px;text-align:left}
.markdown-body th{background:var(--bg);font-weight:600}
.markdown-body img{max-width:100%}
.markdown-body ul,.markdown-body ol{padding-left:24px}
.editor-preview{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:768px){.editor-preview{grid-template-columns:1fr}}
</style></head><body>
<div class="tool-page"><a href="../index.html" class="back-link">← 返回工具箱</a><div class="tool-header"><h1>Markdown 预览</h1><p class="desc">实时预览 Markdown，支持 GitHub 风格语法</p></div>
<div class="tool-body"><div class="editor-preview">
<div class="form-group"><label>Markdown 编辑</label><textarea id="input" oninput="preview()" style="min-height:400px"># Markdown 预览
**粗体** *斜体* `代码`
> 引用文字
- 列表项 1
- 列表项 2
| 表格 | 示例 |
|------|------|
| A | B |</textarea></div>
<div><label>预览效果</label><div id="preview" class="markdown-body" style="min-height:400px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:20px;margin-top:6px;background:var(--surface)"></div></div>
</div></div>
<div class="ad-slot">📢 广告位</div></div>
<script>function preview(){document.getElementById("preview").innerHTML=marked.parse(document.getElementById("input").value)}preview()</script>
<!-- 访问统计 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>👀 本站总访问 <span id="busuanzi_value_site_pv"></span> 次 · 
  <span id="busuanzi_value_site_uv"></span> 人</span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
<script src="../js/music-player.js"></script>
<script src="../js/ambient-effects.js"></script>
<script src="../js/theme-switcher.js"></script>
<script src="../js/web-pet.js"></script>
</body></html>
