<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base64 编解码 - 在线工具箱</title>
<meta name="description" content="在线 Base64 编码解码工具，支持文本和 Unicode 字符，数据本地处理不上传。">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">← 返回工具箱</a>
  <div class="tool-header">
    <h1>Base64 编解码</h1>
    <p class="desc">在线 Base64 编码与解码，支持中文等 Unicode 字符</p>
  </div>
  <div class="tool-body">
    <div class="form-group">
      <label>输入文本</label>
      <textarea id="input" placeholder="输入要编码或解码的文本..."></textarea>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" onclick="encode()">🔒 Base64 编码</button>
      <button class="btn btn-secondary" onclick="decode()">🔓 Base64 解码</button>
      <button class="btn btn-secondary" onclick="swap()">🔄 交换输入输出</button>
      <button class="btn btn-secondary" onclick="clearAll()">🗑 清空</button>
    </div>
    <div id="error" style="color:var(--danger);margin-top:12px;font-size:.9rem;"></div>
    <div class="result-label">输出结果 <button class="copy-btn" onclick="copyResult()">📋 复制</button></div>
    <div class="result-area" id="output"></div>
  </div>
  <div class="ad-slot">📢 广告位</div>
</div>
<script>
var input = document.getElementById("input");
var output = document.getElementById("output");
var errorDiv = document.getElementById("error");
function encode() {
  errorDiv.textContent = "";
  try {
    var encoded = btoa(unescape(encodeURIComponent(input.value)));
    output.textContent = encoded;
  } catch (e) { errorDiv.textContent = "编码失败：" + e.message; }
}
function decode() {
  errorDiv.textContent = "";
  try {
    var decoded = decodeURIComponent(escape(atob(input.value.trim())));
    output.textContent = decoded;
  } catch (e) { errorDiv.textContent = "解码失败：请检查输入是否为有效的 Base64 字符串"; }
}
function swap() {
  var tmp = input.value;
  input.value = output.textContent;
  output.textContent = tmp;
}
function clearAll() { input.value = ""; output.textContent = ""; errorDiv.textContent = ""; }
function copyResult() {
  var t = output.textContent; if (!t) return;
  navigator.clipboard.writeText(t).then(function() {
    var b = event.target; b.textContent = "✅ 已复制"; b.classList.add("copied");
    setTimeout(function() { b.textContent = "📋 复制"; b.classList.remove("copied"); }, 2000);
  });
}
</script>

<!-- 访问统计 -->

  <span id="busuanzi_value_site_uv"></span> 人</span>
</div>

<script src="../js/web-pet.js?v=202606061803"></script>
</body>
</html>
