<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浜岀淮鐮佺敓鎴愬櫒 - 鍦ㄧ嚎宸ュ叿绠?/title>
<meta name="description" content="鍦ㄧ嚎浜岀淮鐮佺敓鎴愬櫒锛岃緭鍏ユ枃鏈垨閾炬帴涓€閿敓鎴愰珮娓呬簩缁寸爜鍥剧墖锛屽厤璐逛笅杞姐€?>
<link rel="stylesheet" href="../css/style.css">
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
<div class="tool-page">
  <a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a>
  <div class="tool-header"><h1>浜岀淮鐮佺敓鎴愬櫒</h1><p class="desc">杈撳叆鏂囨湰鎴栭摼鎺ワ紝涓€閿敓鎴愰珮娓呬簩缁寸爜鍥剧墖</p></div>
  <div class="tool-body">
    <div class="form-group"><label>杈撳叆鍐呭锛堢綉鍧€銆佹枃鏈瓑锛?/label><input type="text" id="input" placeholder="https://example.com 鎴栦换鎰忔枃鏈? oninput="generateQR()"></div>
    <div class="btn-group">
      <button class="btn btn-secondary btn-sm" onclick="downloadQR()">馃捑 涓嬭浇 PNG</button>
    </div>
    <div class="qr-wrap" id="qrContainer"></div>
  </div>
  <div class="ad-slot">馃摙 骞垮憡浣?/div>
</div>
<script>
var input=document.getElementById("input"),container=document.getElementById("qrContainer"),canvasEl=null;
function generateQR(){
  container.innerHTML="";
  var text=input.value.trim();
  if(!text){container.innerHTML='<p style="color:var(--text-secondary)">杈撳叆鍐呭鍚庤嚜鍔ㄧ敓鎴愪簩缁寸爜</p>';return}
  try{
    var canvas=document.createElement("canvas");
    QRCode.toCanvas(canvas,text,{width:280,margin:1,color:{dark:"#1e293b",light:"#ffffff"}},function(err){if(err){container.innerHTML='<p style="color:var(--danger)">鐢熸垚澶辫触</p>';return}container.appendChild(canvas);canvasEl=canvas})
  }catch(e){container.innerHTML='<p style="color:var(--danger)">鐢熸垚澶辫触</p>'}
}
function downloadQR(){if(!canvasEl)return;var link=document.createElement("a");link.download="qrcode.png";link.href=canvasEl.toDataURL("image/png");link.click()}
</script>

<!-- 璁块棶缁熻 -->
<div style="margin-top:16px;font-size:.85rem;color:var(--text-secondary)">
  <span>馃憖 鏈珯鎬昏闂?<span id="busuanzi_value_site_pv"></span> 娆?路 
  <span id="busuanzi_value_site_uv"></span> 浜?/span>
</div>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
