<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>幸运大转盘 - 在线工具箱</title><link rel="stylesheet" href="../css/style.css"><style>
.wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
canvas{border-radius:50%;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.prize-input{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:500px}
.prize-tag{background:var(--primary-light);padding:4px 10px;border-radius:12px;font-size:.82rem;display:flex;align-items:center;gap:4px}
.prize-tag button{background:none;border:none;cursor:pointer;font-size:.8rem;padding:0 2px;opacity:.5}.prize-tag button:hover{opacity:1}
</style></head><body>
<div class="tool-page"><a href="../index.html" class="back-link">← 返回橘子站</a><div class="tool-header"><h1>🎡 幸运大转盘</h1><p class="desc">自定义奖品 · 旋转抽奖 · 公平有趣</p></div>
<div class="tool-body"><div class="wheel-wrap">
<canvas id="wheel" width="400" height="400"></canvas>
<div class="prize-input"><input type="text" id="prizeInput" placeholder="输入奖品名称，回车添加" style="flex:1;min-width:150px"><button class="btn btn-primary btn-sm" onclick="addPrize()">+ 添加</button><button class="btn btn-secondary btn-sm" onclick="resetPrizes()">重置</button></div>
<div id="prizeTags" class="prize-input"></div>
<button class="btn btn-primary" id="spinBtn" onclick="spin()" style="font-size:1.1rem;padding:12px 32px">🎰 开始抽奖!</button>
<div id="result" style="font-size:1.2rem;font-weight:700;color:var(--primary);min-height:30px"></div>
</div></div><div class="ad-slot">📢 广告位</div></div>
<script>
var prizes=["🎁 大奖","🥇 一等奖","🥈 二等奖","🥉 三等奖","🍀 参与奖","💎 神秘奖"];
var canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d");
var spinning=false,angle=0;
function drawWheel(){
  var n=prizes.length,arc=Math.PI*2/n;
  ctx.clearRect(0,0,400,400);
  var colors=["#ff6b6b","#feca57","#48dbfb","#ff9ff3","#54a0ff","#5f27cd","#01a3a4","#f368e0","#ff6348","#7bed9f","#eccc68","#ff7f50"];
  for(var i=0;i<n;i++){
    ctx.beginPath();ctx.moveTo(200,200);ctx.arc(200,200,190,angle+i*arc,angle+(i+1)*arc);ctx.fillStyle=colors[i%colors.length];ctx.fill();
    ctx.save();ctx.translate(200,200);ctx.rotate(angle+i*arc+arc/2);ctx.fillStyle="#fff";ctx.font="bold 14px sans-serif";ctx.textAlign="center";ctx.fillText(prizes[i].substring(0,8),130,5);ctx.restore();
  }
  ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(200,200,30,0,Math.PI*2);ctx.fill();ctx.fillStyle="#333";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("GO",200,206);
  // Pointer
  ctx.fillStyle="#333";ctx.beginPath();ctx.moveTo(200,5);ctx.lineTo(190,25);ctx.lineTo(210,25);ctx.fill();
}
function spin(){
  if(spinning)return;spinning=true;document.getElementById("result").textContent="🎰 转动中...";
  var target=Math.random()*Math.PI*2+Math.PI*6+Math.random()*Math.PI*2;
  var start=angle,duration=3000,startTime=Date.now();
  (function anim(){var elapsed=Date.now()-startTime,p=Math.min(1,elapsed/duration);p=1-Math.pow(1-p,3);
    angle=start+target*p;drawWheel();
    if(p<1)requestAnimationFrame(anim);else{spinning=false;var n=prizes.length,arc=Math.PI*2/n;
      var p=(3*Math.PI/2-angle)%(Math.PI*2);if(p<0)p+=Math.PI*2;var idx=Math.floor(p/arc)%n;
      document.getElementById("result").innerHTML="🎉 恭喜获得: <b>"+prizes[idx]+"</b>";
    }})();
}
function addPrize(){
  var v=document.getElementById("prizeInput").value.trim();if(!v)return;
  prizes.push(v);document.getElementById("prizeInput").value="";renderTags();drawWheel();
}
function removePrize(i){prizes.splice(i,1);if(prizes.length<2)prizes=["奖品1","奖品2"];renderTags();drawWheel()}
function resetPrizes(){prizes=["🎁 大奖","🥇 一等奖","🥈 二等奖","🥉 三等奖","🍀 参与奖","💎 神秘奖"];renderTags();drawWheel();document.getElementById("result").textContent=""}
function renderTags(){
  var cont=document.getElementById("prizeTags");cont.innerHTML="";
  prizes.forEach(function(p,i){var t=document.createElement("span");t.className="prize-tag";t.innerHTML=p+' <button onclick="removePrize('+i+')">×</button>';cont.appendChild(t)});
}
document.getElementById("prizeInput").addEventListener("keydown",function(e){if(e.key==="Enter")addPrize()});
renderTags();drawWheel();
</script>

  var p = document.getElementById('neteasePlayer');
  p.onload = function(){
    // Click anywhere on iframe to toggle play

  // Auto-play on first user interaction anywhere
  function enableAudio(){
    p.src = 'https://music.163.com/outchain/player?type=2&id=536098339&auto=1&height=66';
    document.removeEventListener('click', enableAudio);
    document.removeEventListener('touchstart', enableAudio);
  }

  document.addEventListener('touchstart', enableAudio);
})();
</script>
</body></html>
