<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>倒计时器 - 在线工具箱</title><link rel="stylesheet" href="../css/style.css"><style>
.cd-wrap{display:flex;flex-direction:column;align-items:center;gap:20px}
.cd-display{display:flex;gap:8px;align-items:center;font-size:3rem;font-weight:800;font-family:"SF Mono","Consolas",monospace}
.cd-block{background:var(--primary);color:#fff;padding:12px 18px;border-radius:12px;min-width:70px;text-align:center;box-shadow:0 4px 16px rgba(99,102,241,.25)}
.cd-label{font-size:.75rem;font-weight:400;opacity:.8;margin-top:2px}
.cd-sep{color:var(--text);font-size:2rem}
.cd-inputs{display:flex;gap:8px;align-items:center}
.cd-inputs input{width:60px;text-align:center;font-size:1rem;padding:8px}
</style></head><body>
<div class="tool-page"><a href="../index.html" class="back-link">← 返回橘子站</a><div class="tool-header"><h1>⏱ 倒计时器</h1><p class="desc">设定目标时间 · 精准倒计时 · 到点提醒</p></div>
<div class="tool-body"><div class="cd-wrap">
<div class="cd-display"><div class="cd-block"><div id="dh">00</div><div class="cd-label">天</div></div><div class="cd-sep">:</div><div class="cd-block"><div id="hm">00</div><div class="cd-label">时</div></div><div class="cd-sep">:</div><div class="cd-block"><div id="hh">00</div><div class="cd-label">分</div></div><div class="cd-sep">:</div><div class="cd-block"><div id="hs">00</div><div class="cd-label">秒</div></div></div>
<div class="cd-inputs"><input type="number" id="inH" value="0" min="0" placeholder="时"> : <input type="number" id="inM" value="5" min="0" max="59" placeholder="分"> : <input type="number" id="inS" value="0" min="0" max="59" placeholder="秒"></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" id="btnCD" onclick="toggleCD()">▶ 开始</button><button class="btn btn-secondary" onclick="resetCD()">↺ 重置</button></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn btn-secondary btn-sm" onclick="preset(1)">1分钟</button><button class="btn btn-secondary btn-sm" onclick="preset(3)">3分钟</button><button class="btn btn-secondary btn-sm" onclick="preset(5)">5分钟</button><button class="btn btn-secondary btn-sm" onclick="preset(10)">10分钟</button><button class="btn btn-secondary btn-sm" onclick="preset(30)">30分钟</button></div>
</div></div><div class="ad-slot">📢 广告位</div></div>
<script>
var target=0,remaining=0,running=false,timer=null;
function updateDisp(){
  var d=Math.floor(remaining/86400),h=Math.floor((remaining%86400)/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;
  document.getElementById("dh").textContent=d.toString().padStart(2,"0");
  document.getElementById("hm").textContent=h.toString().padStart(2,"0");
  document.getElementById("hh").textContent=m.toString().padStart(2,"0");
  document.getElementById("hs").textContent=s.toString().padStart(2,"0");
}
function setFromInput(){
  var h=parseInt(document.getElementById("inH").value)||0,m=parseInt(document.getElementById("inM").value)||0,s=parseInt(document.getElementById("inS").value)||0;
  remaining=h*3600+m*60+s;updateDisp();
}
function preset(min){running=false;clearInterval(timer);document.getElementById("btnCD").textContent="▶ 开始";
  remaining=min*60;updateDisp();document.getElementById("inH").value="0";document.getElementById("inM").value=min;document.getElementById("inS").value="0"}
function toggleCD(){
  if(running){running=false;clearInterval(timer);document.getElementById("btnCD").textContent="▶ 继续";return}
  if(remaining<=0)setFromInput();if(remaining<=0)return;
  running=true;document.getElementById("btnCD").textContent="⏸ 暂停";
  timer=setInterval(function(){remaining--;updateDisp();
    if(remaining<=0){running=false;clearInterval(timer);document.getElementById("btnCD").textContent="▶ 开始";
      try{var a=new AudioContext();for(var i=0;i<5;i++){var o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=800+i*200;g.gain.setValueAtTime(.06,a.currentTime+i*.12);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+.2);o.connect(g);g.connect(a.destination);o.start(a.currentTime+i*.12);o.stop(a.currentTime+i*.12+.25)}}catch(e){}}
  },1000);
}
function resetCD(){running=false;clearInterval(timer);document.getElementById("btnCD").textContent="▶ 开始";setFromInput()}
document.getElementById("inH").addEventListener("input",setFromInput);
document.getElementById("inM").addEventListener("input",setFromInput);
document.getElementById("inS").addEventListener("input",setFromInput);
setFromInput();updateDisp();
</script>
