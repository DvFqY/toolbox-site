<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>鏂囨湰瀵规瘮 - 鍦ㄧ嚎宸ュ叿绠?/title><meta name="description" content="鍦ㄧ嚎鏂囨湰瀵规瘮宸ュ叿锛屽姣斾袱娈垫枃鏈樊寮傦紝楂樹寒鏄剧ず澧炲垹鏀广€?><link rel="stylesheet" href="../css/style.css"></head><body>
<div class="tool-page"><a href="../index.html" class="back-link">鈫?杩斿洖宸ュ叿绠?/a><div class="tool-header"><h1>鏂囨湰瀵规瘮</h1><p class="desc">瀵规瘮涓ゆ鏂囨湰鐨勫樊寮傦紝楂樹寒鏄剧ず澧炲垹鏀瑰唴瀹?/p></div>
<div class="tool-body">
<div class="diff-container">
<div><label>鍘熷鏂囨湰</label><textarea id="oldText" style="min-height:250px">绗竴琛屽唴瀹?绗簩琛屽唴瀹?绗笁琛屽唴瀹?绗洓琛屽唴瀹?/textarea></div>
<div><label>鏂版枃鏈?/label><textarea id="newText" style="min-height:250px">绗竴琛屽唴瀹?绗簩琛屼慨鏀逛簡
绗笁琛屽唴瀹?鏂板鐨勪竴琛?/textarea></div>
</div>
<div class="btn-group"><button class="btn btn-primary" onclick="compare()">馃攳 瀵规瘮宸紓</button><button class="btn btn-secondary" onclick="clearAll()">馃棏 娓呯┖</button></div>
<div class="result-label" style="margin-top:20px">宸紓缁撴灉</div>
<div class="result-area diff-result" id="diffResult" style="max-height:500px"></div>
</div><div class="ad-slot">馃摙 骞垮憡浣?/div></div>
<script>
function compare(){
  var oldLines=document.getElementById("oldText").value.split("\n");
  var newLines=document.getElementById("newText").value.split("\n");
  var out=document.getElementById("diffResult");
  var lcs=lcsMatrix(oldLines,newLines);
  var diffs=backtrack(lcs,oldLines,newLines,oldLines.length,newLines.length);
  var html="";
  for(var i=0;i<diffs.length;i++){
    var d=diffs[i];
    if(d.type==="same")html+=d.line+"\n";
    else if(d.type==="del")html+='<del>'+d.line+'</del>\n';
    else html+='<ins>'+d.line+'</ins>\n';
  }
  out.innerHTML=html||"涓ゆ鏂囨湰瀹屽叏鐩稿悓";
}
function lcsMatrix(a,b){
  var m=Array(a.length+1);
  for(var i=0;i<=a.length;i++){m[i]=Array(b.length+1);for(var j=0;j<=b.length;j++){if(i===0||j===0)m[i][j]=0;else if(a[i-1]===b[j-1])m[i][j]=m[i-1][j-1]+1;else m[i][j]=Math.max(m[i-1][j],m[i][j-1])}}
  return m;
}
function backtrack(m,a,b,i,j){
  if(i===0&&j===0)return[];
  if(i>0&&j>0&&a[i-1]===b[j-1]){
    var r=backtrack(m,a,b,i-1,j-1);r.push({type:"same",line:a[i-1]});return r;
  }
  if(j>0&&(i===0||m[i][j-1]>=m[i-1][j])){var r=backtrack(m,a,b,i,j-1);r.push({type:"ins",line:b[j-1]});return r}
  var r=backtrack(m,a,b,i-1,j);r.push({type:"del",line:a[i-1]});return r;
}
function clearAll(){document.getElementById("oldText").value="";document.getElementById("newText").value="";document.getElementById("diffResult").innerHTML=""}
compare();
</script>
